
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'airbnb'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
# Defined in profiles.yml.
profile: 'airbnb'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
# These are all arrays, meaning each can contain multiple paths.
model-paths: ["models"]  # Tables, views, and everything you're building.
analysis-paths: ["analyses"]  # SQLs you want to execute manually.
test-paths: ["tests"]
seed-paths: ["seeds"]  # Local data (e.g., CSVs) you want to push to your warehouse.
macro-paths: ["macros"]  # Small reusable snippets.
snapshot-paths: ["snapshots"]  # SCD type 2 dim tables.
asset-paths: ["assets"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"  # Created anytime you run dbt.
  - "dbt_packages"  # Created when installing packages.

on-run-start:
  - "CREATE TABLE IF NOT EXISTS {{ target.schema }}.audit_log (
      model_name STRING,
      run_timestamp TIMESTAMP
    )"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
# These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
# The `+` sign denotes a built-in property of dbt.
models:
  airbnb:
    +grants:
      select: ["transform", "reporter"]
    +post-hook:
      - "INSERT INTO {{ target.schema }}.audit_log VALUES ('{{ this }}', CURRENT_TIMESTAMP)"
    +materialized: view 
    dim:
      +materialized: table
    src:
      +materialized: ephemeral
    fct:
      +tags: ['fact']

# data_tests:
  # +store_failures: true  # Can be used to output test results (both passed and failed) into the warehouse.
  # +schema: _test_failures  # Can be used to override the default test result schema.
