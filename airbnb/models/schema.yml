models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.

    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
          config:
            severity: error

    columns:
      - name: listing_id
        description: Primary key for the listing.
        data_tests:
          - unique
          - not_null

      - name: room_type
        description: Type of the apartment / room.
        data_tests:
          - accepted_values:
              arguments:
                values: [ 'Entire home/apt', 'Private room', 'Shared room', 'Hotel room' ] # 'Hotel room - break this'

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

      - name: host_id
        description: The host's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

  - name: dim_hosts_cleansed
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        deprecation_date: 2030-01-01
      - v: 2
        columns:
          - include: '*'
            exclude: [ host_name ]
          - name: host_name
            description: The name of the host (N/A if not available)
            data_type: string
            constraints:
              - type: not_null
    latest_version: 2

    description: Cleansed table for the Airbnb hosts.

    config:
      contract:
        enforced: true

    columns:
      - name: host_id
        description: The id of the host. This is the primary key.
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique

      - name: host_name
        description: The name of the host.
        data_type: string
        constraints:
          - type: not_null

      - name: is_superhost
        description: Defines whether the host is a superhost.
        data_type: string # Intentionally not a Boolean.
        data_tests:
          - accepted_values:
              arguments:
                values: [ 't', 'f' ]

      - name: created_at
        data_type: timestamp

      - name: updated_at
        data_type: timestamp

  - name: dim_listings_w_hosts
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                # I.e., we want 99% of the values to be between 50 and 500.
                quantile: 0.99
                min_value: 50
                max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                max_value: 5000
              config:
                severity: warn

  - name: fct_reviews
    columns:
      - name: listing_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id

      - name: reviewer_name
        data_tests:
          - not_null

      - name: review_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: [ 'positive', 'neutral', 'negative' ]

  - name: int_host_performance
    description: An intermediate model that tracks the performance of Airbnb hosts. The metrics cover total listings, price information, Airbnb types, length of Airbnb profile, and portfolio size for each host.
    columns:
      - name: host_id
        description: The primary key for an Airbnb host.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: host_name
        description: The name of the host.
        data_type: varchar
      - name: total_listings
        data_type: number
      - name: avg_listing_price
        data_type: number
      - name: min_listing_price
        data_type: number
      - name: max_listing_price
        data_type: number
      - name: entire_home_count
        data_type: number
      - name: private_room_count
        data_type: number
      - name: shared_room_count
        data_type: number
      - name: hotel_room_count
        data_type: number
      - name: avg_minimum_nights
        data_type: number
      - name: portfolio_size
        data_type: varchar
      - name: host_status
        data_type: varchar
      - name: host_tenure
        data_type: varchar
      - name: dominant_room_type
        data_type: varchar

  - name: mart_listing_performance
    columns:
      - name: listing_id
        data_type: number
      - name: listing_name
        data_type: varchar
      - name: room_type
        data_type: varchar
      - name: price
        data_type: number
      - name: minimum_nights
        data_type: number
      - name: host_id
        data_type: number
      - name: host_name
        data_type: varchar
      - name: host_is_superhost
        data_type: varchar
      - name: total_listings
        data_type: number
      - name: host_portfolio_avg_price
        data_type: number
      - name: portfolio_size
        data_type: varchar
      - name: host_status
        data_type: varchar
      - name: host_tenure
        data_type: varchar
      - name: price_position_vs_portfolio
        data_type: varchar
      - name: price_segment
        data_type: varchar
